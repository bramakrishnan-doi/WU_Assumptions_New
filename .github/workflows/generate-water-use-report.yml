name: Generate Water Use Assumptions

on:
  workflow_dispatch:
    inputs:
      config:
        description: Monthly run configuration file
        required: true
        default: config/monthly_run.json
        type: string

permissions:
  contents: write

jobs:
  generate:
    name: Validate and generate reports
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run regression tests
        shell: pwsh
        run: |
          python -m pytest -q tests

      - name: Read report month
        shell: pwsh
        run: |
          $config = Get-Content "${{ inputs.config }}" -Raw | ConvertFrom-Json
          $reportMonth = $config.report_month

          if (-not $reportMonth) {
            throw "report_month was not found in the monthly configuration."
          }

          "REPORT_MONTH=$reportMonth" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          $reportDir = "reports/$reportMonth"

          "REPORT_DIR=$reportDir" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $reportDir | Out-Null

          Write-Host "Reports will be written to $reportDir"

      - name: Generate monthly reports
        shell: pwsh
        run: |
          python generate_report.py `
            --config "${{ inputs.config }}" `
            --output-dir "$env:REPORT_DIR"

      - name: Add run summary
        if: always()
        shell: pwsh
        run: |
          $summary = "$env:REPORT_DIR/run_summary.md"

          if (Test-Path $summary) {
            Get-Content $summary |
              Out-File `
                -FilePath $env:GITHUB_STEP_SUMMARY `
                -Append `
                -Encoding utf8
          }

            - name: Commit generated Word reports
        if: success()
        shell: pwsh
        run: |
          Write-Host "Report directory: $env:REPORT_DIR"
          Write-Host "Current branch: ${{ github.ref_name }}"

          Write-Host "Files generated:"
          Get-ChildItem -Path "$env:REPORT_DIR" -Recurse

          $docxFiles = Get-ChildItem `
            -Path "$env:REPORT_DIR" `
            -Filter "*.docx" `
            -File

          if ($docxFiles.Count -eq 0) {
            throw "No generated DOCX files were found in $env:REPORT_DIR"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          foreach ($file in $docxFiles) {
            Write-Host "Staging $($file.FullName)"
            git add -f -- "$($file.FullName)"
          }

          Write-Host "Git status after staging:"
          git status --short

          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {
            Write-Host "No report changes to commit."
          }
          else {
            git commit -m "Add Water Use assumptions reports for $env:REPORT_MONTH"

            git push origin "HEAD:${{ github.ref_name }}"
          }

      - name: Upload generated reports as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: water-use-assumptions-${{ env.REPORT_MONTH }}
          path: ${{ env.REPORT_DIR }}/*.docx
          if-no-files-found: error
          retention-days: 90